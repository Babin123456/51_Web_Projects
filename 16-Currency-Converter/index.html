<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Currency Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container" role="main">
        <header class="converter-header">
            <div class="icon-badge">💱</div>
            <h1>Currency Converter</h1>
            <p class="subtitle">Real-time global exchange rates</p>
        </header>

        <section class="card" aria-label="Currency conversion form">
            <div class="currency-group">
                <label for="currency-first" class="sr-only">Source Currency</label>
                <select id="currency-first" aria-label="Select source currency"></select>
                <div class="input-wrapper">
                    <input type="number" id="worth-first" value="1" min="0" step="any" placeholder="0.00" aria-label="Amount to convert">
                </div>
            </div>

            <div class="swap-wrapper">
                <button id="swap-btn" type="button" class="swap-btn" title="Swap currencies" aria-label="Swap source and target currencies">
                    ⇄
                </button>
            </div>

            <div class="currency-group">
                <label for="currency-second" class="sr-only">Target Currency</label>
                <select id="currency-second" aria-label="Select target currency"></select>
                <div class="input-wrapper">
                    <input type="number" id="worth-second" placeholder="0.00" disabled aria-label="Converted amount">
                </div>
            </div>

            <div class="info-footer">
                <p class="exchange-rate" id="exchange-rate" aria-live="polite">Calculating rate...</p>
                <p class="status-message" id="status-message" aria-live="assertive"></p>
                <span class="last-updated" id="last-updated">Live</span>
            </div>
        </section>
    </main>

    <script src="./currencies.js"></script>
    <script src="./app.js"></script>
</body>
</html>
