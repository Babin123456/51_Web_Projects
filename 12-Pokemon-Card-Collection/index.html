<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Card Collection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="pokedex-header">
        <div class="header-container">
            <div class="logo-area">
                <span class="pokeball-icon">🔴</span>
                <h1>Pokédex Card Collection</h1>
            </div>
            <div class="controls-area">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Search by name or #ID..." aria-label="Search Pokémon by name or ID">
                </div>
                <div class="favorites-indicator" title="Favorites count">
                    <span>⭐ Favorites:</span>
                    <strong id="fav-count">0</strong>
                </div>
            </div>
            <nav class="filter-bar" aria-label="Filter Pokémon by type">
                <button class="filter-pill active" data-type="All">All</button>
                <button class="filter-pill" data-type="Favorites">⭐ Favorites</button>
                <button class="filter-pill" data-type="Fire">🔥 Fire</button>
                <button class="filter-pill" data-type="Water">💧 Water</button>
                <button class="filter-pill" data-type="Grass">🍃 Grass</button>
                <button class="filter-pill" data-type="Electric">⚡ Electric</button>
                <button class="filter-pill" data-type="Psychic">🔮 Psychic</button>
                <button class="filter-pill" data-type="Dragon">🐉 Dragon</button>
            </nav>
        </div>
    </header>

    <main id="main" class="cards-grid" role="region" aria-label="Pokemon Cards Grid">
        <!-- Rendered dynamically by script.js -->
    </main>

    <!-- Detail Modal -->
    <div id="card-modal" class="modal-backdrop" aria-hidden="true" role="dialog" aria-modal="true">
        <div class="modal-container">
            <button id="close-modal" class="close-modal-btn" aria-label="Close details dialog">&times;</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="./pokemon-data.js"></script>
    <script src="./script.js"></script>
</body>
</html>
