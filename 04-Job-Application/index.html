<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Job Application Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <main class="apply-box" role="main">
            <header class="form-header">
                <h1>Job Application <span class="title-small">(Engineering)</span></h1>
                <p class="subtitle">Complete the fields below to submit your candidacy</p>
            </header>

            <form id="job-form" novalidate>
                <div class="form-container">
                    <div class="form-control">
                        <label for="first_name">First Name *</label>
                        <input id="first_name" name="first_name" type="text" placeholder="e.g. John" required>
                    </div>

                    <div class="form-control">
                        <label for="last_name">Last Name *</label>
                        <input id="last_name" name="last_name" type="text" placeholder="e.g. Doe" required>
                    </div>

                    <div class="form-control">
                        <label for="email">Email Address *</label>
                        <input id="email" name="email" type="email" placeholder="john.doe@example.com" required>
                    </div>

                    <div class="form-control">
                        <label for="job_role">Job Role *</label>
                        <select id="job_role" name="job_role" required>
                            <option value="">Select Job Role</option>
                            <option value="frontend">Frontend Developer</option>
                            <option value="backend">Backend Developer</option>
                            <option value="full_stack">Full Stack Developer</option>
                            <option value="ui_ux">UI/UX Designer</option>
                            <option value="devops">DevOps Engineer</option>
                        </select>
                    </div>

                    <div class="textarea_control">
                        <label for="address">Residential Address *</label>
                        <textarea id="address" name="address" rows="3" placeholder="Enter your full street address" required></textarea>
                    </div>

                    <div class="form-control">
                        <label for="city">City *</label>
                        <input id="city" name="city" type="text" placeholder="e.g. San Francisco" required>
                    </div>

                    <div class="form-control">
                        <label for="pin_code">Postal / PIN Code *</label>
                        <input id="pin_code" name="pin_code" type="text" placeholder="e.g. 94105" required>
                    </div>

                    <div class="form-control">
                        <label for="date">Earliest Start Date *</label>
                        <input id="date" name="date" type="date" required>
                    </div>

                    <div class="file-control">
                        <label for="cv-upload">Upload Resume / CV (PDF, DOCX up to 5MB) *</label>
                        <div id="file-dropzone" class="dropzone" role="button" tabindex="0" aria-label="Drop your resume file here or click to browse">
                            <span class="drop-icon">📁</span>
                            <p>Drag & drop your resume here, or <span class="browse-link">Browse</span></p>
                            <input type="file" id="cv-upload" name="cv_upload" accept=".pdf,.doc,.docx" class="sr-only">
                        </div>
                        <div id="file-preview" class="file-preview-area"></div>
                    </div>
                </div>

                <div class="button-container">
                    <button type="submit" class="submit-btn">Submit Application</button>
                </div>
            </form>
        </main>
    </div>

    <!-- Success Modal Dialog -->
    <div id="success-modal" class="modal-backdrop" aria-hidden="true" role="dialog" aria-modal="true">
        <div class="modal-card">
            <div class="success-icon">✅</div>
            <h2>Application Submitted!</h2>
            <p class="modal-subtitle">Thank you for applying. We have received your submission.</p>
            <div id="modal-summary" class="summary-box"></div>
            <button id="close-modal-btn" type="button" class="modal-close-btn">Done</button>
        </div>
    </div>

    <script src="./validation.js"></script>
    <script src="./app.js"></script>
</body>
</html>
